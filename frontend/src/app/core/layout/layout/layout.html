<div class="d-flex">
  <!-- Sidebar -->
  <aside class="sidebar bg-dark text-white" [class.abierto]="menuAbierto()">
    <div class="p-3 border-bottom border-secondary">
      <span class="fs-4 fw-bold">SEBRIT</span>
    </div>
    <ul class="nav nav-pills flex-column p-2 gap-1">
      @for (e of enlaces; track e.ruta) {
        <li class="nav-item">
          @if (auth.puede(e.modulo, 'ver')) {
            <a
              class="nav-link text-white"
              [routerLink]="e.ruta"
              routerLinkActive="active"
              (click)="cerrarMenu()"
            >
              <i class="bi {{ e.icono }} me-2"></i>{{ e.texto }}
            </a>
          } @else {
            <span
              class="nav-link bloqueado"
              aria-disabled="true"
              tabindex="0"
              [attr.aria-describedby]="'pista-' + e.modulo"
            >
              <i class="bi {{ e.icono }} me-2"></i>{{ e.texto }}
              <i class="bi bi-lock-fill ms-auto candado" aria-hidden="true"></i>
              <span class="pista" role="tooltip" [id]="'pista-' + e.modulo">Solo administradores</span>
            </span>
          }
        </li>
      }
    </ul>
  </aside>

  <!-- Contenido -->
  <div class="flex-grow-1 min-vh-100">
    <nav class="navbar bg-white border-bottom px-3">
      <button class="btn btn-outline-secondary d-md-none" (click)="alternarMenu()">
        <i class="bi bi-list"></i>
      </button>
      <span class="navbar-text ms-2 fw-semibold">{{ tituloPanel() }}</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <i class="bi bi-person-circle fs-4"></i>
        <span class="d-none d-sm-inline">{{ auth.usuario()?.nombre }}</span>
        <button
          class="btn btn-sm btn-outline-secondary ms-2"
          (click)="auth.logout()"
          title="Cerrar sesión"
        >
          <i class="bi bi-box-arrow-right"></i>
          <span class="d-none d-sm-inline ms-1">Salir</span>
        </button>
      </div>
    </nav>

    <main class="p-3 p-md-4">
      <router-outlet />
    </main>
  </div>
</div>
