<main class="sin-permiso d-flex align-items-center justify-content-center min-vh-100 p-3 p-sm-4">
  <div class="w-100 contenido">
    <div class="text-center mb-4">
      <span class="fs-3 fw-bold">SEBRIT</span>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-sm-5 text-center">
        <div class="icono mx-auto mb-4" aria-hidden="true">
          <i class="bi bi-shield-lock"></i>
        </div>

        <h1 class="h3 fw-semibold mb-3">No tienes acceso a esta sección</h1>

        @if (auth.usuario(); as u) {
          <p class="mb-2">
            Iniciaste sesión como <strong>{{ u.nombre }}</strong>
            @if (rol(); as r) {
              <span class="text-muted">&nbsp;({{ r }})</span>
            }.
          </p>
        }
        <p class="text-muted mb-4">
          Por ahora el panel solo está disponible para administradores. Si necesitas acceso,
          pide a un administrador que revise tu cuenta.
        </p>

        <button type="button" class="btn btn-primary btn-lg w-100" (click)="auth.logout()">
          <i class="bi bi-box-arrow-left me-2"></i>Ingresar con otra cuenta
        </button>
      </div>
    </div>
  </div>
</main>
