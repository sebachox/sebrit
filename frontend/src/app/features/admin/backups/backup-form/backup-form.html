<form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  @if (errorGeneral(); as e) {
    <div class="alert alert-danger py-2" role="alert">{{ e }}</div>
  }

  <div class="row g-3">
    <div class="col-sm-6 col-lg-3">
      <label for="bk-estado" class="form-label">Estado</label>
      <select id="bk-estado" class="form-select" formControlName="estado" [class.is-invalid]="invalido('estado')">
        @for (e of estados; track e.valor) {
          <option [value]="e.valor">{{ e.texto }}</option>
        }
      </select>
      <div class="invalid-feedback">{{ mensaje('estado') }}</div>
    </div>

    <div class="col-sm-6 col-lg-3">
      <label for="bk-tipo" class="form-label">Tipo <span class="text-danger" aria-hidden="true">*</span></label>
      <select id="bk-tipo" class="form-select" formControlName="tipo" [class.is-invalid]="invalido('tipo')">
        <option value="" disabled>Elige el tipo</option>
        @for (t of tipos; track t.valor) {
          <option [value]="t.valor">{{ t.texto }}</option>
        }
      </select>
      <div class="invalid-feedback">{{ mensaje('tipo') }}</div>
    </div>

    <div class="col-sm-6 col-lg-3">
      <label for="bk-fecha" class="form-label">Fecha y hora</label>
      <input id="bk-fecha" type="datetime-local" class="form-control" formControlName="fecha" [class.is-invalid]="invalido('fecha')" />
      <div class="invalid-feedback">{{ mensaje('fecha') }}</div>
    </div>

    <div class="col-sm-6 col-lg-3">
      <label for="bk-tamano" class="form-label">Tamaño (GB)</label>
      <input id="bk-tamano" type="number" min="0" step="0.01" inputmode="decimal" class="form-control numerico" formControlName="tamano_gb" [class.is-invalid]="invalido('tamano_gb')" />
      <div class="invalid-feedback">{{ mensaje('tamano_gb') }}</div>
    </div>

    <div class="col-12">
      <label for="bk-notas" class="form-label">Notas</label>
      <textarea id="bk-notas" rows="2" class="form-control" formControlName="notas" placeholder="Destino, herramienta, observaciones..."></textarea>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="cancelado.emit()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="enviando()">
      @if (enviando()) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Guardando...
      } @else {
        <i class="bi bi-check-lg me-1"></i>{{ backup() ? 'Guardar cambios' : 'Registrar backup' }}
      }
    </button>
  </div>
</form>
